name: 統合版 カスタム神シード検索ツール(エラー完全排除版)

on:
  workflow_dispatch:
    inputs:
      structure_type:
        description: '① 探したい構造物を選んでください'
        required: true
        default: 'RuinedPortal'
        type: choice
        options:
          - 'RuinedPortal'        # 荒廃したポータル
          - 'BuriedTreasure'      # 埋もれた宝
          - 'Stronghold'          # 要塞（エンドポータル）
          - 'NetherFortress'      # ネザー要塞
          - 'Bastion'             # 廃要塞
      max_distance:
        description: '② 初期スポーン(0,0)からの最大距離（マス）※宝以外'
        required: true
        default: '20'
      max_seeds:
        description: '③ スキャンするシード数'
        required: true
        default: '10000000'

jobs:
  fsg-search:
    runs-on: ubuntu-latest
    steps:
    - name: 🛠️ 1.18+対応 自己完結型検索エンジンの生成
      run: |
        cat << 'EOF' > main.cpp
        #include <iostream>
        #include <cmath>
        #include <string>
        #include <cstdint>

        struct BedrockPos { int x; int z; };

        // 統合版 1.18+ 専用の構造物座標ジェネレーター
        BedrockPos get_1_18_pos(std::string type, uint64_t seed) {
            uint64_t K = 0x5deece66dULL;
            uint64_t M = 0xbULL;
            uint64_t salt = 0;
            int spacing = 1;
            
            // FSGで重要な主要構造物の生成定数
            if (type == "RuinedPortal") { salt = 30001; spacing = 40; }
            else if (type == "Stronghold") { salt = 10001; spacing = 80; }
            else if (type == "NetherFortress") { salt = 30000; spacing = 27; }
            else if (type == "Bastion") { salt = 30000; spacing = 27; }
            
            uint64_t region_seed = (seed + salt) ^ K;
            region_seed = (region_seed * K + M) & 0xffffffffffffULL;
            int cx = (region_seed >> 16) % spacing;
            
            region_seed = (region_seed * K + M) & 0xffffffffffffULL;
            int cz = (region_seed >> 16) % spacing;
            
            return {cx * 16 + 8, cz * 16 + 8};
        }

        int main() {
            std::string target_type = "${{ github.event.inputs.structure_type }}";
            double max_dist = ${{ github.event.inputs.max_distance }};
            uint64_t max_seeds = ${{ github.event.inputs.max_seeds }};

            std::cout << "========================================================\n";
            std::cout << "⚡ 【1.18+対応版】統合版 神シードスキャン中...\n";
            std::cout << "========================================================\n";

            for (uint64_t seed = 0; seed < max_seeds; ++seed) {
                // 🌟 埋もれた宝の判定（初期1チャンク 0,0 判定）
                if (target_type == "BuriedTreasure") {
                    uint64_t K = 0x5deece66dULL;
                    uint64_t M = 0xbULL;
                    uint64_t rs = (seed + 40001) ^ K;
                    rs = (rs * K + M) & 0xffffffffffffULL;
                    int cx = (rs >> 16) % 16;
                    rs = (rs * K + M) & 0xffffffffffffULL;
                    int cz = (rs >> 16) % 16;
                    
                    if (cx == 0 && cz == 0) {
                        std::cout << "🎯 【神シード発見】 Seed: " << seed << " (初期1チャンク内に埋もれた宝が確定)\n";
                    }
                    continue;
                }

                // 🌟 その他の構造物の判定
                BedrockPos pos = get_1_18_pos(target_type, seed);
                double dist = std::sqrt((double)pos.x * pos.x + (double)pos.z * pos.z);
                
                if (dist <= max_dist) {
                    std::cout << "🎯 【神シード発見】 Seed: " << seed 
                              << " (距離: " << dist << "マス / 座標 X: " << pos.x << ", Z: " << pos.z << ")\n";
                }
            }

            std::cout << "--------------------------------------------------------\n";
            std::cout << "🔎 検索が完了しました。\n";
            return 0;
        }
        EOF

    - name: 🏗️ エラーゼロの単独爆速ビルド
      run: |
        g++ -O3 main.cpp -o finder

    - name: 🎯 シード値スキャン実行！
      run: ./finder
