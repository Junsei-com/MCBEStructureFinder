name: 統合版 カスタム神シード検索ツール(自動修正版)

on:
  workflow_dispatch:
    inputs:
      structure_type:
        description: '① 探したい構造物を選んでください'
        required: true
        default: 'BERuinedPortal'
        type: choice
        options:
          - 'BERuinedPortal'      # 荒廃したポータル（スクリプトが自動でBERuindPortalに直します）
          - 'BEBuriedTreasure'    # 埋もれた宝
          - 'BEStronghold'        # 要塞（エンドポータル）
          - 'BEFortress'          # ネザー要塞
          - 'BEBastion'           # 廃要塞
      max_distance:
        description: '② 初期スポーン(0,0)からの最大距離（マス）※宝以外'
        required: true
        default: '20'
      max_seeds:
        description: '③ スキャンするシード数（まずは1000万個がおすすめ）'
        required: true
        default: '10000000'

jobs:
  fsg-search:
    runs-on: ubuntu-latest
    steps:
    - name: 🚀 本物の検索エンジン(Cubiomes一体型)を準備
      run: |
        git clone https://github.com/bedrock-dev/MCBEStructureFinder.git
        cd MCBEStructureFinder
        git submodule update --init --recursive

    - name: 🛠️ 拡張Pythonスクリプトによる本物関数の自動検出とコード生成
      run: |
        cd MCBEStructureFinder
        python3 -c '
        import re, sys

        # 1. ヘッダーファイルを読み込んで内部の本当の定義をスキャン
        with open("be_finder.h", "r") as f:
            header = f.read()

        # 2. BEStructureTypeを引数に持つ、またはPosを返す正しい関数名を自動探索
        func_name = None
        matches = re.findall(r"(\w+)\s*\([^)]*BEStructureType", header)
        if matches:
            func_name = matches[0]
        else:
            matches = re.findall(r"(?:Pos|BlockPos)\s+(\w+)\s*\(", header)
            if matches:
                func_name = matches[0]

        if not func_name:
            func_name = "getStructurePos" # 最終フォールバック

        # 3. 選択された構造物名のタイポ（eの有無）をヘッダーに合わせて自動補正
        target_input = "${{ github.event.inputs.structure_type }}"
        target_type = target_input
        if target_input == "BERuinedPortal" and "BERuindPortal" in header:
            target_type = "BERuindPortal"

        max_dist_val = "${{ github.event.inputs.max_distance }}"
        max_seeds_val = "${{ github.event.inputs.max_seeds }}"

        print(f"[AI自動判定] 使用する本物関数: {func_name}")
        print(f"[AI自動判定] ターゲット識別子: {target_type}")

        # 4. 完全に適合した main.cpp を動的生成
        with open("main.cpp", "w") as f:
            f.write("#include <iostream>\n")
            f.write("#include <cmath>\n")
            f.write("#include \"be_finder.h\"\n\n")
            f.write("int main() {\n")
            f.write("    init_biomes();\n")
            f.write("    LayerStack g;\n")
            f.write("    setupGenerator(&g, MC_1_20);\n\n")
            f.write(f"    BEStructureType target_type = {target_type};\n")
            f.write(f"    double max_dist = {max_dist_val};\n")
            f.write(f"    uint64_t max_seeds = {max_seeds_val};\n\n")
            f.write("    std::cout << \"========================================================\\n\";\n")
            f.write("    std::cout << \"⚡ 【自動解析版】統合版 1.18〜1.21+ 神シードスキャン中...\\n\";\n")
            f.write(f"    std::cout << \"🎯 探索対象: {target_type} / 使用関数: {func_name}\\n\";\n")
            f.write("    std::cout << \"========================================================\\n\";\n\n")
            f.write("    for (uint64_t seed = 0; seed < max_seeds; ++seed) {\n")
            f.write(f"        Pos pos = {func_name}(target_type, seed, 0, 0);\n\n")
            f.write("        if (target_type == BEBuriedTreasure) {\n")
            f.write("            if (pos.x >= 0 && pos.x <= 16 && pos.z >= 0 && pos.z <= 16) {\n")
            f.write("                std::cout << \"🎯 【神シード発見】 Seed: \" << seed << \" (初期1チャンク内に埋もれた宝: X=\" << pos.x << \", Z=\" << pos.z << \")\\n\";\n")
            f.write("            }\n")
            f.write("            continue;\n")
            f.write("        }\n\n")
            f.write("        double dist = std::sqrt((double)pos.x * pos.x + (double)pos.z * pos.z);\n")
            f.write("        if (dist <= max_dist) {\n")
            f.write("            std::cout << \"🎯 【神シード発見】 Seed: \" << seed << \" (距離: \" << dist << \"マス / 座標 X: \" << pos.x << \", Z: \" << pos.z << \")\\n\";\n")
            f.write("        }\n")
            f.write("    }\n\n")
            f.write("    std::cout << \"--------------------------------------------------------\\n\";\n")
            f.write("    std::cout << \"🔎 検索が完了しました。\\n\";\n")
            f.write("    return 0;\n")
            f.write("}\n")
        '

    - name: 🏗️ クラウドパワーで爆速ビルド
      run: |
        cd MCBEStructureFinder
        g++ -O3 -fpermissive main.cpp be_finder.cpp structure.cpp cubiomes/*.c -I. -Icubiomes -o finder

    - name: 🎯 シード値スキャン実行！
      run: |
        cd MCBEStructureFinder
        ./finder
