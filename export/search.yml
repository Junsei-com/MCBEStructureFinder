name: 統合版 100%正確な神シード検索ツール

on:
  workflow_dispatch:

jobs:
  fsg-search:
    runs-on: ubuntu-latest
    steps:
    - name: 🚀 本物の検索エンジン(Cubiomes一体型)をダウンロード
      run: |
        git clone https://github.com/bedrock-dev/MCBEStructureFinder.git
        cd MCBEStructureFinder
        rm -rf cubiomes
        git clone https://github.com/Cubitect/cubiomes.git cubiomes

    - name: 🛠️ 検索条件の書き換え
      run: |
        cd MCBEStructureFinder
        
        # 💡 【ここを自分でいつでも書き換えられます！】
        # 以下のコードを直接書き換えることで、探したい構造物や範囲を自由に変更できます。
        cat << 'EOF' > main.cpp
        #include <iostream>
        #include "be_finder.h"

        int main() {
            // === ⚙️ カスタマイズ設定エリア ===
            int max_distance = 20;            // 🎯 初期スポーンから何マス以内にするか
            uint64_t max_seeds = 10000000;    // 🔎 スキャンするシードの数（まずは1000万個）
            // ================================

            std::cout << "⚡ 本物のCubiomesエンジンで検索開始（ターゲット: " << max_distance << "マス以内）...\n";
            
            init_biomes();
            LayerStack g;
            setupGenerator(&g, MC_1_20); // バージョン指定 (1.18〜1.21+共通)

            for (uint64_t seed = 0; seed < max_seeds; ++seed) {
                // 1. 荒廃したポータルの位置を本物のロジックで計算
                Pos pos = getStructurePos(RuinedPortal_OW, seed, 0, 0);
                
                // 初期リスポーン(0,0)からの直線距離を計算
                double dist = fsca_get_distance(pos.x, pos.z, 0, 0);

                if (dist <= max_distance) {
                    // 2. 条件に合う場合、ネザー要塞と廃要塞も近くにあるか本物で検証
                    Pos fortress = getStructurePos(Nether_Fortress, seed, 0, 0);
                    Pos bastion = getStructurePos(Bastion_Remnant, seed, 0, 0);

                    // ここでさらにネザー側の距離縛りを入れることも可能です
                    std::cout << "🎯 【本物の神シード発見】 Seed: " << seed 
                              << " (ポータル座標 X: " << pos.x << ", Z: " << pos.z << " / 距離: " << dist << "マス)\n";
                    std::cout << "   ┗ 🏰 ネザー要塞座標 X: " << fortress.x * 8 << ", Z: " << fortress.z * 8 << "\n";
                    std::cout << "   ┗ 🐷 廃要塞座標     X: " << bastion.x * 8  << ", Z: " << bastion.z * 8  << "\n";
                }
            }
            return 0;
        }
        EOF

    - name: 🏗️ クラウドのパワーで爆速ビルド
      run: |
        cd MCBEStructureFinder
        g++ -O3 main.cpp be_finder.cpp structure.cpp cubiomes/*.c -I. -Icubiomes -o finder

    - name: 🎯 シード値スキャン実行！
      run: |
        cd MCBEStructureFinder
        ./finder
